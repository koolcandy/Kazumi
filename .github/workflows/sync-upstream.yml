name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Use a fine-grained PAT scoped to this repository with Contents and
      # Workflows read/write permissions, stored as UPSTREAM_SYNC_TOKEN.
      # GITHUB_TOKEN cannot push upstream changes to .github/workflows/.
      - name: Check sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
            echo "::error::请配置仓库 Secret UPSTREAM_SYNC_TOKEN，授予本仓库 Contents 和 Workflows 读写权限"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Predidit/Kazumi.git
          git fetch upstream main

      - name: Merge upstream
        run: |
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::上游合并冲突，需要手动解决"
            exit 1
          fi

      - name: Push merged result
        run: git push origin HEAD:main
