name: Android nightly release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-nightly-release
  cancel-in-progress: true

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

jobs:
  build-android-arm64:
    name: Build Android ARM64 nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android ARM64 APK
        run: >-
          flutter build apk --release
          --target-platform android-arm64
          --split-per-abi
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY

      - name: Prepare release asset
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Kazumi_android_arm64_nightly.apk

      - name: Update nightly GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Android ARM64
          body: |
            自动构建自 `main` 最新提交：`${{ github.sha }}`
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: Kazumi_android_arm64_nightly.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
